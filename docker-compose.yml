services:
  # Milvus Vector Database
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - capstone_network

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - capstone_network

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.3
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - capstone_network

  # Python Server
  python-server:
    build:
      context: ./python-server
      dockerfile: Dockerfile
    container_name: capstone_python_server
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
      - MILVUS_URI=http://milvus:19530
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    # No auth on this service: reachable from the host for debugging only, never from the network
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./python-server/data:/app/data
      - ./python-server/volumes:/app/volumes
      # node-server downloads uploads here and sends the paths to /embed
      - upload_tmp:/shared/uploads:ro
    depends_on:
      # RAGService connects to Milvus at import time
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - capstone_network

  # Node.js Server
  node-server:
    build:
      context: ./node-server
      dockerfile: dockerfile
    container_name: capstone_node_server
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - RAG_API_URL=http://python-server:8080
      - UPLOAD_TMP_DIR=/shared/uploads
      - DB_URL=${DB_URL}
      - ACCESS_TOKEN_VALIDITY_SEC=${ACCESS_TOKEN_VALIDITY_SEC:-3600}
      - REFRESH_TOKEN_VALIDITY_SEC=${REFRESH_TOKEN_VALIDITY_SEC:-86400}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - MASTER_SECRET=${MASTER_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_BUCKET=${AWS_BUCKET}
    ports:
      - "3001:3000"
    volumes:
      - ./node-server/logs:/app/logs
      - upload_tmp:/shared/uploads
    depends_on:
      - python-server
    healthcheck:
      # alpine images ship busybox wget, not curl
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthCheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - capstone_network

  # Client (Frontend)
  client:
    build:
      context: ./client
      dockerfile: dockerfile
      args:
        # Baked into the browser bundle at build time: node-server as the browser sees it, trailing slash, no /api
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/}
    container_name: capstone_client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - node-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - capstone_network

volumes:
  etcd_data:
    driver: local
  minio_data:
    driver: local
  milvus_data:
    driver: local
  upload_tmp:
    driver: local

networks:
  capstone_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
